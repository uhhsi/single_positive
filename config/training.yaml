TRAIN:
  train_batch_size: 32
  valid_batch_size: 32
  lr: 0.0003
  weight_decay: 0.01
  min_epochs: 20
  max_epochs: 200
  patience: 20
  device: [1]
  num_workers: 8
  seed: 0
  model_save_path: ./save_model
  model_save_filename: medseg

MODEL:
  bert_type: microsoft/BiomedVLP-CXR-BERT-specialized
  vision_type: facebook/convnext-tiny-224
  project_dim: 768

DATA:
  dataset: mosmed
  labeled_ratio: 25
  image_size: [224, 224]
  data_root: /disk_7t/lt_data/datasets/multimodal/TextMoE_data
